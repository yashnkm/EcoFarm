name: Deploy to VPS

on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Backend build ─────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build backend jar
        working-directory: ecoFarm
        run: mvn -B -ntp clean package -DskipTests

      - name: Extract thin jar + lib
        working-directory: ecoFarm
        run: |
          JAR=$(ls target/*.jar | grep -v sources | grep -v javadoc | head -1)
          mkdir -p extracted
          java -Djarmode=tools -jar "$JAR" extract --destination extracted
          # Rename to stable filename so systemd service reference never changes
          mv extracted/ecoFarm-*.jar extracted/ecoFarm.jar
          echo "thin jar : $(du -sh extracted/ecoFarm.jar)"
          echo "lib dir  : $(du -sh extracted/lib)"

      # ── Frontend build ────────────────────────────────────────
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ecofarm-ui/package-lock.json

      - name: Install + build frontend
        working-directory: ecofarm-ui
        env:
          VITE_API_URL: /api/v1
        run: |
          npm ci
          npm run build

      # ── Deploy ────────────────────────────────────────────────
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Use stored host key if provided, otherwise fall back to keyscan
          if [ -n "${{ secrets.VPS_KNOWN_HOST }}" ]; then
            echo "${{ secrets.VPS_KNOWN_HOST }}" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p ${{ secrets.VPS_PORT }} -T 30 ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          fi
          # Tune SSH to fail fast on dead connections and accept new host keys
          printf 'Host *\n  StrictHostKeyChecking accept-new\n  ConnectTimeout 30\n  ServerAliveInterval 30\n  ServerAliveCountMax 3\n' >> ~/.ssh/config

      - name: Upload artifacts
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
          P: ${{ secrets.VPS_PORT }}
        run: |
          # Retry helper: up to 3 attempts with 20 s back-off
          retry() {
            local n=1
            until "$@"; do
              if [ $n -ge 3 ]; then echo "All $n attempts failed: $*" >&2; return 1; fi
              echo "Attempt $n failed — retrying in 20 s..."
              n=$((n+1)); sleep 20
            done
          }

          # rsync backend: lib/ (~66 MB) is skipped when deps haven't changed.
          # Only the thin ecoFarm.jar (~2 MB) transfers on normal code-only deploys.
          retry rsync -az --delete -e "ssh -p $P" ecoFarm/extracted/ "$U@$H:/opt/ecofarm/app/"

          # Frontend: already a small compressed tar
          tar -C ecofarm-ui/dist -czf dist.tar.gz .
          retry scp -P "$P" dist.tar.gz "$U@$H:/opt/ecofarm/ui-new.tar.gz"

      - name: Ensure email + login-url config on VPS
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
          P: ${{ secrets.VPS_PORT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          # Idempotent: only append once. The key travels over the ssh stdin
          # pipe (never a command-line arg, never echoed), so it never lands
          # in remote `ps` output or these logs.
          NEEDS_RESEND=$(ssh -p "$P" -o ConnectTimeout=30 "$U@$H" 'grep -q "^  resend:" /opt/ecofarm/config/application.yml && echo yes || echo no')
          if [ "$NEEDS_RESEND" = "no" ]; then
            printf '  resend:\n    api-key: "%s"\n    from: "EcoFarm <welcome@mail.chandramaautomation.com>"\n  frontend:\n    login-url: "https://iot.chandramaautomation.com/login"\n' "$RESEND_API_KEY" \
              | ssh -p "$P" -o ConnectTimeout=30 "$U@$H" "cat >> /opt/ecofarm/config/application.yml"
            echo "Appended app.resend / app.frontend config to VPS"
          else
            echo "app.resend already configured on VPS — skipping"
          fi

      - name: Activate new release
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
          P: ${{ secrets.VPS_PORT }}
        run: |
          ssh -p "$P" -o ConnectTimeout=30 "$U@$H" bash -s <<'EOF'
          set -euo pipefail

          # Run DB migrations
          DB_USER=$(awk '/datasource:/{f=1} f && /username:/{gsub(/"/, ""); print $2; exit}' /opt/ecofarm/config/application.yml)
          DB_PASS=$(awk '/datasource:/{f=1} f && /password:/{gsub(/"/, ""); print $2; exit}' /opt/ecofarm/config/application.yml)
          PGPASSWORD="$DB_PASS" psql -h 127.0.0.1 -U "$DB_USER" -d ecofarm \
            -c "ALTER TABLE poll_groups ADD COLUMN IF NOT EXISTS function_code INTEGER NOT NULL DEFAULT 3;" \
            -c "ALTER TABLE poll_groups ALTER COLUMN function_code DROP DEFAULT;" \
            -c "ALTER TABLE refresh_tokens ADD COLUMN IF NOT EXISTS active_tenant_id UUID REFERENCES tenants(id) ON DELETE SET NULL;" \
            -c "ALTER TABLE tenants DROP COLUMN IF EXISTS mqtt_broker_id;" \
            -c "ALTER TABLE command_templates ADD COLUMN IF NOT EXISTS prompt_for_value BOOLEAN NOT NULL DEFAULT false;" \
            -c "ALTER TABLE command_templates ALTER COLUMN prompt_for_value DROP DEFAULT;" \
            -c "ALTER TABLE command_templates ADD COLUMN IF NOT EXISTS off_value INTEGER;" \
            -c "ALTER TABLE command_templates ADD COLUMN IF NOT EXISTS status_data_point_key VARCHAR(100);" \
            -c "ALTER TABLE data_points DROP CONSTRAINT IF EXISTS data_points_data_type_check;" \
            -c "ALTER TABLE data_points DROP CONSTRAINT IF EXISTS data_points_display_widget_check;" \
            -c "ALTER TABLE command_templates ADD COLUMN IF NOT EXISTS category VARCHAR(20);" \
            -c "ALTER TABLE command_templates ADD COLUMN IF NOT EXISTS scale_factor NUMERIC(12,6);" \
            -c "ALTER TABLE command_templates ADD COLUMN IF NOT EXISTS offset_value NUMERIC(12,6);" \
            -c "ALTER TABLE command_templates ADD COLUMN IF NOT EXISTS unit VARCHAR(50);" \
            -c "ALTER TABLE devices ADD COLUMN IF NOT EXISTS sort_order INTEGER;" \
            -c "ALTER TABLE devices ADD COLUMN IF NOT EXISTS zone_order JSONB;" \
            -c "ALTER TABLE command_templates ADD COLUMN IF NOT EXISTS key VARCHAR(100);" \
            -c 'DO $pgdo$
            DECLARE
              rec record;
              cname text;
              reftable text;
            BEGIN
              FOR rec IN SELECT * FROM (VALUES
                ($str$refresh_tokens$str$, $str$user_id$str$, $str$CASCADE$str$),
                ($str$password_reset_tokens$str$, $str$user_id$str$, $str$CASCADE$str$),
                ($str$invitation_tokens$str$, $str$user_id$str$, $str$CASCADE$str$),
                ($str$refresh_tokens$str$, $str$active_tenant_id$str$, $str$SET NULL$str$)
              ) AS x(tbl, col, act) LOOP
                SELECT c.conname, r.relname INTO cname, reftable
                  FROM pg_constraint c JOIN pg_class r ON r.oid = c.confrelid
                  WHERE c.conrelid = rec.tbl::regclass AND c.contype = $str$f$str$
                    AND c.conkey = ARRAY[(SELECT attnum FROM pg_attribute WHERE attrelid = rec.tbl::regclass AND attname = rec.col)]
                    AND pg_get_constraintdef(c.oid) NOT LIKE ($str$%ON DELETE $str$ || rec.act || $str$%$str$);
                IF cname IS NOT NULL THEN
                  EXECUTE format($str$ALTER TABLE %I DROP CONSTRAINT %I$str$, rec.tbl, cname);
                  EXECUTE format($str$ALTER TABLE %I ADD CONSTRAINT %I FOREIGN KEY (%I) REFERENCES %I(id) ON DELETE $str$ || rec.act, rec.tbl, cname, rec.col, reftable);
                END IF;
              END LOOP;
            END $pgdo$;' \
            -c 'DO $pgdo2$
            DECLARE
              cmd record;
              dp record;
            BEGIN
              FOR cmd IN
                SELECT c.id, c.profile_id, c.status_data_point_key, c.key AS cur_key, c.name AS cur_name
                FROM command_templates c
                WHERE c.status_data_point_key IS NOT NULL
              LOOP
                SELECT d.key, d.label INTO dp
                FROM data_points d
                WHERE d.profile_id = cmd.profile_id AND d.key = cmd.status_data_point_key;

                IF FOUND THEN
                  IF cmd.cur_key IS DISTINCT FROM dp.key
                     AND NOT EXISTS (
                       SELECT 1 FROM command_templates o
                       WHERE o.profile_id = cmd.profile_id AND o.id <> cmd.id AND o.key = dp.key
                     ) THEN
                    UPDATE command_templates SET key = dp.key WHERE id = cmd.id;
                  END IF;

                  IF cmd.cur_name IS DISTINCT FROM dp.label
                     AND NOT EXISTS (
                       SELECT 1 FROM command_templates o
                       WHERE o.profile_id = cmd.profile_id AND o.id <> cmd.id AND o.name = dp.label
                     ) THEN
                    UPDATE command_templates SET name = dp.label WHERE id = cmd.id;
                  END IF;
                END IF;
              END LOOP;
            END $pgdo2$;'

          # Add admin subdomain to CORS allowed origins if not already present
          ADMIN_ORIGIN="https://admin.iot.chandramaautomation.com"
          if ! grep -q "$ADMIN_ORIGIN" /opt/ecofarm/config/application.yml; then
            sed -i "s|allowed-origins:.*|allowed-origins: https://iot.chandramaautomation.com,$ADMIN_ORIGIN|" /opt/ecofarm/config/application.yml
          fi

          # Swap UI atomically via directory rename
          rm -rf /opt/ecofarm/ui-staging
          mkdir -p /opt/ecofarm/ui-staging
          tar -xzf /opt/ecofarm/ui-new.tar.gz -C /opt/ecofarm/ui-staging
          rm -rf /opt/ecofarm/ui-old
          if [ -d /opt/ecofarm/ui ]; then mv /opt/ecofarm/ui /opt/ecofarm/ui-old; fi
          mv /opt/ecofarm/ui-staging /opt/ecofarm/ui
          rm -f /opt/ecofarm/ui-new.tar.gz

          # Restart backend, reload nginx
          sudo /bin/systemctl restart ecofarm
          sudo /bin/systemctl reload nginx

          # Wait for health
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/actuator/health > /dev/null; then
              echo "Backend healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy in 60s" >&2
          sudo /bin/systemctl status ecofarm --no-pager || true
          exit 1
          EOF
