spring.application.name=ecoFarm
server.port=8080

# ── PostgreSQL ──
spring.datasource.url=jdbc:postgresql://localhost:5432/ecofarm
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── Flyway (disabled — Hibernate manages schema) ──
spring.flyway.enabled=false

# ── JWT ──
app.jwt.secret=3f8a2b4c1d9e7f6a5b3c2d1e4f7a8b9c0d3e2f1a4b5c6d7e8f9a0b1c2d3e4f5
app.jwt.expiry-ms=900000
app.jwt.refresh-expiry-ms=604800000

# ── MQTT (seed values — after first boot, manage in UI → Brokers) ──
app.mqtt.broker-url=tcp://77.37.47.14:1884
app.mqtt.client-id=ecofarm-backend
app.mqtt.username=trb145
app.mqtt.password=trb1234
app.mqtt.qos=1

# ── CORS ──
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174

# ── Email (Resend) — blank api-key = local dev, EmailService logs instead of sending ──
app.resend.api-key=${RESEND_API_KEY:}
app.resend.from=EcoFarm <welcome@mail.chandramaautomation.com>
app.frontend.login-url=http://localhost:5173/login
